name: Build foobar2000 SDK (x86 + x64, Debug + Release)

on:
  workflow_dispatch:  # 手动触发
  push:
    paths:
      - '**/*.vcxproj'
      - '**/*.h'
      - '**/*.cpp'
      - '.github/workflows/build-sdk.yml'

jobs:
  build:
    runs-on: windows-2022
    strategy:
      matrix:
        include:
          # 4 个配置：Debug|Win32, Release|Win32, Debug|x64, Release|x64
          - { platform: Win32, configuration: Debug,   outdir: debug-x86, libname_dir: foobar2000_SDK }
          - { platform: Win32, configuration: Release, outdir: x86,        libname_dir: foobar2000_SDK }
          - { platform: x64,   configuration: Debug,   outdir: debug-x64, libname_dir: foobar2000_SDK }
          - { platform: x64,   configuration: Release, outdir: x64,        libname_dir: foobar2000_SDK }

    steps:
      - name: Checkout SDK
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Fix Platform Toolset v142 → v143
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Recurse -Filter *.vcxproj | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            if ($content -match 'v142') {
              Write-Host "Fixing: $($_.FullName)"
              $content -replace '<PlatformToolset>v142</PlatformToolset>', '<PlatformToolset>v143</PlatformToolset>' |
                Set-Content $_.FullName -NoNewline
            }
          }

      - name: Build foobar2000_SDK.lib
        shell: cmd
        run: |
          msbuild foobar2000\SDK\foobar2000_SDK.vcxproj ^
            /p:Configuration=${{ matrix.configuration }} ^
            /p:Platform=${{ matrix.platform }} ^
            /p:OutDir=${{ matrix.outdir }}\foobar2000_SDK\ ^
            /p:IntDir=obj\foobar2000_SDK\${{ matrix.outdir }}\

      - name: Build pfc.lib
        shell: cmd
        run: |
          msbuild pfc\pfc.vcxproj ^
            /p:Configuration=${{ matrix.configuration }} ^
            /p:Platform=${{ matrix.platform }} ^
            /p:OutDir=${{ matrix.outdir }}\pfc\ ^
            /p:IntDir=obj\pfc\${{ matrix.outdir }}\

      - name: Build foobar2000_component_client.lib
        shell: cmd
        run: |
          msbuild foobar2000\foobar2000_component_client\foobar2000_component_client.vcxproj ^
            /p:Configuration=${{ matrix.configuration }} ^
            /p:Platform=${{ matrix.platform }} ^
            /p:OutDir=${{ matrix.outdir }}\foobar2000_component_client\ ^
            /p:IntDir=obj\component_client\${{ matrix.outdir }}\

      - name: Build helpers (foobar2000_sdk_helpers.lib)
        shell: cmd
        run: |
          if exist foobar2000\helpers\foobar2000_sdk_helpers.vcxproj (
            msbuild foobar2000\helpers\foobar2000_sdk_helpers.vcxproj ^
              /p:Configuration=${{ matrix.configuration }} ^
              /p:Platform=${{ matrix.platform }} ^
              /p:OutDir=${{ matrix.outdir }}\helpers\ ^
              /p:IntDir=obj\helpers\${{ matrix.outdir }}\
          )

      - name: Upload artifacts (${{ matrix.outdir }})
        uses: actions/upload-artifact@v4
        with:
          name: sdk-${{ matrix.outdir }}
          path: |
            ${{ matrix.outdir }}/
            !obj/
          retention-days: 90

  # ============================================================
  # 单独编译 shared 库（输出 shared-Win32.lib / shared-x64.lib）
  # ============================================================
  build-shared:
    runs-on: windows-2022
    strategy:
      matrix:
        include:
          - { platform: Win32, target_name: shared-Win32 }
          - { platform: x64,   target_name: shared-x64 }
    steps:
      - name: Checkout SDK
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Fix Platform Toolset v142 → v143
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Recurse -Filter *.vcxproj | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            if ($content -match '<PlatformToolset>v142</PlatformToolset>') {
              $content -replace '<PlatformToolset>v142</PlatformToolset>', '<PlatformToolset>v143</PlatformToolset>' |
                Set-Content $_.FullName -NoNewline
            }
          }

      - name: Patch shared.vcxproj to StaticLibrary + correct TargetName
        shell: pwsh
        run: |
          $f = "foobar2000\shared\shared.vcxproj"
          $c = Get-Content $f -Raw
          # 把所有 DynamicLibrary 改成 StaticLibrary（让 shared 输出 .lib 而不是 .dll）
          $c = $c -replace '<ConfigurationType>DynamicLibrary</ConfigurationType>', '<ConfigurationType>StaticLibrary</ConfigurationType>'
          # 让输出文件名按平台区分：Win32 → shared-Win32, x64 → shared-x64
          # 通过注入 TargetName 实现
          $c = $c -replace '</Project>', "<ItemDefinitionGroup Condition=`"`'`$(Configuration)|`$(Platform)`'==`'Release|$($args[0])`'`"><Lib><OutputFile>`$(OutDir)$($args[1]).lib</OutputFile></Lib></ItemDefinitionGroup></Project>"
          Set-Content $f -Value $c -NoNewline
        env: { args0: ${{ matrix.platform }}, args1: ${{ matrix.target_name }} }

      - name: Build shared (Release ${{ matrix.platform }})
        shell: cmd
        run: |
          msbuild foobar2000\shared\shared.vcxproj ^
            /p:Configuration=Release ^
            /p:Platform=${{ matrix.platform }} ^
            /p:OutDir=shared-output\ ^
            /p:TargetName=${{ matrix.target_name }} ^
            /p:IntDir=obj\shared\${{ matrix.platform }}\

      - name: Rename shared.lib to target name (fallback)
        shell: cmd
        run: |
          if exist shared-output\shared.lib (
            move shared-output\shared.lib shared-output\${{ matrix.target_name }}.lib
          )
          dir shared-output\

      - name: Upload shared artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdk-shared-${{ matrix.platform }}
          path: shared-output/
          retention-days: 90

  # ============================================================
  # 合并所有 artifact，按 foo_nowbar 期望的目录结构打包
  # ============================================================
  package:
    needs: [build, build-shared]
    runs-on: windows-2022
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded/

      - name: Organize into foo_nowbar expected layout
        shell: cmd
        run: |
          mkdir sdk-pack\lib\columns_ui\foobar2000\SDK
          mkdir sdk-pack\lib\columns_ui\foobar2000\shared
          mkdir sdk-pack\lib\columns_ui\pfc

          :: foobar2000_SDK.lib 4 个配置
          xcopy /E /I downloaded\sdk-debug-x86\debug-x86\foobar2000_SDK sdk-pack\lib\columns_ui\foobar2000\SDK\debug-x86\foobar2000_SDK\
          xcopy /E /I downloaded\sdk-x86\x86\foobar2000_SDK          sdk-pack\lib\columns_ui\foobar2000\SDK\x86\foobar2000_SDK\
          xcopy /E /I downloaded\sdk-debug-x64\debug-x64\foobar2000_SDK sdk-pack\lib\columns_ui\foobar2000\SDK\debug-x64\foobar2000_SDK\
          xcopy /E /I downloaded\sdk-x64\x64\foobar2000_SDK            sdk-pack\lib\columns_ui\foobar2000\SDK\x64\foobar2000_SDK\

          :: pfc.lib 4 个配置
          xcopy /E /I downloaded\sdk-debug-x86\debug-x86\pfc sdk-pack\lib\columns_ui\pfc\debug-x86\pfc\
          xcopy /E /I downloaded\sdk-x86\x86\pfc            sdk-pack\lib\columns_ui\pfc\x86\pfc\
          xcopy /E /I downloaded\sdk-debug-x64\debug-x64\pfc sdk-pack\lib\columns_ui\pfc\debug-x64\pfc\
          xcopy /E /I downloaded\sdk-x64\x64\pfc            sdk-pack\lib\columns_ui\pfc\x64\pfc\

          :: shared 库（shared-Win32.lib / shared-x64.lib）
          copy downloaded\sdk-shared-Win32\shared-output\shared-Win32.lib sdk-pack\lib\columns_ui\foobar2000\shared\
          copy downloaded\sdk-shared-x64\shared-output\shared-x64.lib    sdk-pack\lib\columns_ui\foobar2000\shared\

          :: 顺便也保留 SDK 源代码（foo_nowbar 编译时需要头文件）
          :: 这部分通过 checkout 拉取，不需要打包

          dir sdk-pack\lib\columns_ui /s

      - name: Create zip
        shell: powershell
        run: |
          Compress-Archive -Path sdk-pack\* -DestinationPath foobar2000-sdk-libs.zip -CompressionLevel Optimal

      - name: Upload final artifact
        uses: actions/upload-artifact@v4
        with:
          name: foobar2000-sdk-libs
          path: foobar2000-sdk-libs.zip
          retention-days: 90

      - name: Create release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sdk-${{ github.run_number }}
          name: foobar2000 SDK build #${{ github.run_number }}
          files: foobar2000-sdk-libs.zip
          generate_release_notes: false
          prerelease: false
